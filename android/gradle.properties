# Memory caps are load-bearing: the build box has ~3 GB RAM and 4 cores. If the
# Kotlin daemon OOMs, lower the caps rather than raising them.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
