# Memory caps are load-bearing: the build box has ~3 GB RAM and 4 cores. If the
# Kotlin daemon OOMs, lower the caps rather than raising them.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
# AGP 8.7.3 was tested up to compileSdk 35 and warns on every build above it. Play requires
# targetSdk 36, the build and tests pass against it, so the warning is acknowledged here.
# Remove this line when AGP moves to a version tested with 36.
android.suppressUnsupportedCompileSdk=36
